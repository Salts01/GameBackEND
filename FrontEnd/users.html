<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GameBackEND - Usuários</title>

</head>

<body>

    <h1>Gerenciamento de Usuários</h1>

    <a href="./dashboard.html">
        Voltar para Dashboard
    </a>

    <hr>


    <h2>Criar usuário</h2>

    <input
        id="nomeNovo"
        type="text"
        placeholder="Nome">

    <br><br>

    <input
        id="emailNovo"
        type="email"
        placeholder="Email">

    <br><br>

    <input
        id="senhaNova"
        type="password"
        placeholder="Senha">

    <br><br>

    <input
        id="nivelNovo"
        type="number"
        min="1"
        max="4"
        placeholder="Nível">

    <br><br>

    <button onclick="criarUsuario()">
        Criar usuário
    </button>


    <hr>


    <h2>Usuários cadastrados</h2>

    <table border="1">

        <thead>

            <tr>

                <th>Nome</th>

                <th>Email</th>

                <th>Nível</th>

                <th>Ativo</th>

                <th>Ações</th>

            </tr>

        </thead>

        <tbody id="listaUsuarios">

        </tbody>

    </table>


    <script src="./users.js"></script>

</body>

</html>
