<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

```
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>GameBackEND - Jogos</title>
```

</head>

<body>

```
<h1>Gerenciamento de Jogos</h1>

<a href="./dashboard.html">
    Voltar para Dashboard
</a>

<hr>

<div id="areaPublicar">

    <h2>Publicar jogo</h2>

    <input
        id="nomeGame"
        type="text"
        placeholder="Nome do jogo">

    <br><br>

    <input
        id="ratingGame"
        type="number"
        min="0"
        max="10"
        placeholder="Rating">

    <br><br>

    <label>
        <input
            id="privadoGame"
            type="checkbox">

        Jogo privado
    </label>

    <br><br>

    <button onclick="publicarGame()">
        Publicar
    </button>

</div>

<hr>

<h2>Jogos</h2>

<table border="1">

    <thead>

        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Rating</th>
            <th>Privado</th>
            <th>Ações</th>
        </tr>

    </thead>

    <tbody id="listaGames">
    </tbody>

</table>

<script src="./games.js"></script>
```

</body>

</html>
