<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <title>Gerenciar Jogos</title>

</head>


<body>


<h1>Gerenciamento de Jogos</h1>


<h2>Lista de jogos</h2>



<table border="1">


<thead>

<tr>

<th>ID</th>
<th>Nome</th>
<th>Rating</th>
<th>Privado</th>
<th>Ações</th>

</tr>


</thead>



<tbody id="listaGames">


</tbody>



</table>



<hr>



<h2>Publicar jogo</h2>


<label>
Nome:
</label>

<input 
id="nomeGame"
type="text"
>


<br>


<label>
Rating:
</label>

<input 
id="ratingGame"
type="number"
>


<br>


<label>
Privado:
</label>


<select id="privadoGame">


<option value="false">
Não
</option>


<option value="true">
Sim
</option>


</select>



<br><br>



<button onclick="publicarGame()">

Publicar jogo

</button>




<br><br>


<button onclick="voltarDashboard()">

Voltar

</button>



<script src="games.js"></script>


</body>


</html>
